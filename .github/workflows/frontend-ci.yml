name: Frontend CI

on:
  push:
    branches: ["Amrhz"]
  pull_request:
    branches: ["Amrhz"]
  workflow_dispatch:

jobs:
  build:
    name: React build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
